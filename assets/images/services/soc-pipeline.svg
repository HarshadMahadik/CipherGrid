<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" fill="none">
  <defs>
    <linearGradient id="pip-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="16" fill="url(#pip-bg)" stroke="#334155" stroke-width="1.5"/>
  <text x="40" y="48" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F8FAFC">SOC Pipeline Architecture: End-to-End Threat Lifecycle</text>
  
  <!-- Step 1 -->
  <g transform="translate(40, 80)">
    <rect width="180" height="220" rx="12" fill="#0B132B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="31" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38BDF8">1</text>
    <text x="64" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Ingestion</text>
    <text x="20" y="80" font-family="sans-serif" font-size="12" fill="#94A3B8">• Cloud APIs & SIEM</text>
    <text x="20" y="105" font-family="sans-serif" font-size="12" fill="#94A3B8">• Endpoint EDR logs</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#94A3B8">• Network NetFlow</text>
    <text x="20" y="155" font-family="sans-serif" font-size="12" fill="#94A3B8">• Identity / Okta</text>
    <rect x="20" y="180" width="140" height="24" rx="4" fill="#1E293B"/>
    <text x="30" y="196" font-family="monospace" font-size="10" fill="#38BDF8">&gt; 2.4M EPS Ingested</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(255, 80)">
    <rect width="180" height="220" rx="12" fill="#0B132B" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="rgba(129, 140, 248, 0.2)"/>
    <text x="31" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#818CF8">2</text>
    <text x="64" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">AI Correlation</text>
    <text x="20" y="80" font-family="sans-serif" font-size="12" fill="#94A3B8">• Behavioral baseline</text>
    <text x="20" y="105" font-family="sans-serif" font-size="12" fill="#94A3B8">• MITRE ATT&CK mapping</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#94A3B8">• Threat intelligence feed</text>
    <text x="20" y="155" font-family="sans-serif" font-size="12" fill="#94A3B8">• Anomaly clustering</text>
    <rect x="20" y="180" width="140" height="24" rx="4" fill="#1E293B"/>
    <text x="30" y="196" font-family="monospace" font-size="10" fill="#818CF8">99.4% Noise Filtered</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(470, 80)">
    <rect width="180" height="220" rx="12" fill="#0B132B" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="31" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F59E0B">3</text>
    <text x="64" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Analyst Triage</text>
    <text x="20" y="80" font-family="sans-serif" font-size="12" fill="#94A3B8">• Level 2/3 validation</text>
    <text x="20" y="105" font-family="sans-serif" font-size="12" fill="#94A3B8">• Blast radius review</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#94A3B8">• Reverse engineering</text>
    <text x="20" y="155" font-family="sans-serif" font-size="12" fill="#94A3B8">• Customer notification</text>
    <rect x="20" y="180" width="140" height="24" rx="4" fill="#1E293B"/>
    <text x="30" y="196" font-family="monospace" font-size="10" fill="#F59E0B">&lt; 5 Min SLA Time</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(685, 80)">
    <rect width="180" height="220" rx="12" fill="#0B132B" stroke="#10B981" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="31" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">4</text>
    <text x="64" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#F8FAFC">Containment</text>
    <text x="20" y="80" font-family="sans-serif" font-size="12" fill="#94A3B8">• Automated isolation</text>
    <text x="20" y="105" font-family="sans-serif" font-size="12" fill="#94A3B8">• Token revocation</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#94A3B8">• Firewall ACL update</text>
    <text x="20" y="155" font-family="sans-serif" font-size="12" fill="#94A3B8">• Executive post-mortem</text>
    <rect x="20" y="180" width="140" height="24" rx="4" fill="#1E293B"/>
    <text x="30" y="196" font-family="monospace" font-size="10" fill="#10B981">Zero Data Loss</text>
  </g>

  <!-- Connecting arrows -->
  <path d="M220 190 L255 190" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M435 190 L470 190" stroke="#818CF8" stroke-width="2"/>
  <path d="M650 190 L685 190" stroke="#F59E0B" stroke-width="2"/>
</svg>