<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="grid-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.4)" />
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background Board -->
  <rect width="800" height="600" rx="16" fill="url(#grid-bg)" stroke="#1E293B" stroke-width="2"/>
  
  <!-- Cyber Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
  </g>

  <!-- Central Threat Radar Rings -->
  <g transform="translate(400, 300)">
    <circle r="220" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle r="160" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>
    <circle r="100" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="40" stroke="#38BDF8" stroke-width="2"/>
    <circle r="6" fill="#38BDF8"/>
    <!-- Crosshairs -->
    <line x1="-240" y1="0" x2="240" y2="0" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <line x1="0" y1="-240" x2="0" y2="240" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
  </g>

  <!-- Telemetry Nodes and Attack Vectors -->
  <!-- Threat 1: Intercepted APT41 -->
  <g transform="translate(560, 210)">
    <circle r="16" fill="rgba(239, 68, 68, 0.2)" />
    <circle r="6" fill="#EF4444" />
    <rect x="18" y="-14" width="130" height="28" rx="6" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <text x="26" y="4" font-family="monospace" font-size="11" fill="#FCA5A5" font-weight="bold">BLOCKED: APT-41</text>
  </g>

  <!-- Threat 2: Mitigated DDoS -->
  <g transform="translate(240, 380)">
    <circle r="14" fill="rgba(245, 158, 11, 0.2)" />
    <circle r="5" fill="#F59E0B" />
    <rect x="-140" y="-14" width="130" height="28" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="-132" y="4" font-family="monospace" font-size="11" fill="#FCD34D" font-weight="bold">DDoS: 420 Gbps</text>
  </g>

  <!-- Threat 3: Zero Trust Verified Token -->
  <g transform="translate(280, 180)">
    <circle r="14" fill="rgba(16, 185, 129, 0.2)" />
    <circle r="5" fill="#10B981" />
    <rect x="-145" y="-14" width="135" height="28" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="-137" y="4" font-family="monospace" font-size="11" fill="#6EE7B7" font-weight="bold">MFA VERIFIED: OK</text>
  </g>

  <!-- Connecting Vector Lines -->
  <path d="M 400 300 L 560 210" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 400 300 L 240 380" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 400 300 L 280 180" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Top Dashboard Bar -->
  <rect x="20" y="20" width="760" height="48" rx="10" fill="#0B132B" stroke="#1E293B"/>
  <circle cx="44" cy="44" r="5" fill="#10B981"/>
  <text x="60" y="48" font-family="monospace" font-size="13" fill="#E2E8F0" font-weight="bold">SOC SENTINEL v4.8 :: GLOBAL TELEMETRY ONLINE</text>
  <text x="590" y="48" font-family="monospace" font-size="12" fill="#38BDF8">INGESTION: 1.84M EPS</text>

  <!-- Bottom Metrics Panel -->
  <g transform="translate(40, 510)">
    <rect width="160" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#94A3B8">AVG MITIGATION SLA</text>
    <text x="16" y="48" font-family="monospace" font-size="20" fill="#38BDF8" font-weight="bold">&lt; 3.8 MIN</text>
  </g>
  <g transform="translate(220, 510)">
    <rect width="160" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#94A3B8">THREATS INTERCEPTED</text>
    <text x="16" y="48" font-family="monospace" font-size="20" fill="#10B981" font-weight="bold">99.98%</text>
  </g>
  <g transform="translate(400, 510)">
    <rect width="160" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#94A3B8">ACTIVE AGENTS</text>
    <text x="16" y="48" font-family="monospace" font-size="20" fill="#F8FAFC" font-weight="bold">42,890</text>
  </g>
  <g transform="translate(580, 510)">
    <rect width="180" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
    <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#94A3B8">DEFENSE POSTURE</text>
    <text x="16" y="48" font-family="monospace" font-size="18" fill="#10B981" font-weight="bold">HARDENED (DEFCON 4)</text>
  </g>
</svg>